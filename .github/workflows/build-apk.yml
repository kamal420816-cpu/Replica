name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Arrange project
        run: |
          set -e
          P=proj
          SRC=$P/app/src/main/java/com/example/fluidplay
          mkdir -p "$SRC"
          for f in MainActivity.kt MpvEngine.kt SmoothMode.kt; do
            found=$(find . -name "$f" -not -path "./$P/*" | head -1)
            [ -n "$found" ] || { echo "Missing file: $f"; exit 1; }
            cp "$found" "$SRC/$f"
          done
          found=$(find . -name AndroidManifest.xml -not -path "./$P/*" | head -1)
          [ -n "$found" ] || { echo "Missing file: AndroidManifest.xml"; exit 1; }
          cp "$found" "$P/app/src/main/AndroidManifest.xml"

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FluidPlay"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.fluidplay"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.fluidplay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("dev.jdtech.mpv:libmpv:1.0.0")
          }
          EOF

          find $P -type f | sort

      - name: Build debug APK
        working-directory: proj
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "^e: |error:|What went wrong|Could not|Execution failed|requires|Caused by|Unresolved" -A2 ../build.log | head -40 > ../errors.txt
            { echo "## Build errors"; echo '```'; cat ../errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            msg=$(head -c 1500 ../errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle error::$msg"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: FluidPlay-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
